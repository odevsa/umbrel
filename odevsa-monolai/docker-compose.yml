version: "3.7"

services:
  app:
    image: odevsa/monolai:latest
    container_name: monolai
    restart: on-failure
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - MODELS_DIR=/app/models
      - RUNTIMES_DIR=/app/runtimes
      - DATA_DIR=/app/data
    volumes:
      - ${APP_DATA_DIR}/models:/app/models
      - ${APP_DATA_DIR}/runtimes:/app/runtimes
      - ${APP_DATA_DIR}/data:/app/data

  app_proxy:
    environment:
      APP_HOST: monolai
      APP_PORT: 8080
