tagline: Lightweight local AI model manager and OpenAI-compatible runtime
icon: https://raw.githubusercontent.com/odevsa/umbrel/refs/heads/main/odevsa-monolai/icon.png
description: >-
  Monolai is a lightweight, local AI model manager and OpenAI-compatible runtime built with Rust and SvelteKit.
  Run local models (GGUF) privately on your hardware with automatic GPU detection (CUDA, ROCm, Vulkan) and multi-threaded CPU fallback.
  Features include automated runtime management (llama.cpp, stable-diffusion.cpp), drop-in OpenAI-compatible API (/v1/chat/completions), real-time hardware telemetry (CPU, RAM, GPU), and a modern Web UI.
